<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessd Cargo Movers - Secure Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0b1329;
            --bg-surface: rgba(28, 37, 65, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-gold: #e5a93c;
            --primary-hover: #cca353;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Split Screen Layout */
        .portal-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Side: Brand Visual Panel */
        .visual-panel {
            flex: 1.2;
            background: radial-gradient(circle at 30% 30%, #1c2541 0%, #0b1329 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 3rem;
            border-right: 1px solid var(--border-subtle);
        }

        /* Integrated Custom Visual Badge Asset Background Layer */
        .visual-panel::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background-image: url('unnamed.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: slowRotate 40s linear infinite;
        }

        /* Brand Identity Elements */
        .brand-wrapper {
            text-align: center;
            z-index: 2;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(229, 169, 60, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        /* Loaded User Asset: realistic_eagle_logo.png */
        .logo-container img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-main);
            line-height: 1.3;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .brand-divider {
            width: 60px;
            height: 3px;
            background: var(--primary-gold);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .brand-tagline {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 400;
        }

        /* Right Side: Interaction Form */
        .form-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            background: #070c19;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 2.5rem;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Custom Input Styling */
        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field {
            width: 100%;
            padding: 1.1rem 3.5rem 1.1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .password-field::placeholder {
            color: #475569;
        }

        .password-field:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(229, 169, 60, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.25rem;
            user-select: none;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-gold);
        }

        /* Action Buttons */
        .unlock-button {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #bd8422 100%);
            border: none;
            border-radius: 12px;
            color: #0b1329;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(229, 169, 60, 0.2);
        }

        .unlock-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 169, 60, 0.4);
        }

        .unlock-button:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
            font-weight: 500;
        }

        .forgot-link:hover {
            color: var(--primary-gold);
        }

        /* Subtle Ambient Rotation for the Badge Background */
        @keyframes slowRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Premium Shake Keyframes for Invalid Authentication */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Responsive UI Adjustments */
        @media (max-width: 968px) {
            body { overflow-y: auto; }
            .portal-container { flex-direction: column; }
            .visual-panel { flex: none; padding: 4rem 2rem 2rem 2rem; border-right: none; border-bottom: 1px solid var(--border-subtle); }
            .form-panel { flex: 1; padding: 3rem 1.5rem; }
            .brand-title { font-size: 1.8rem; }
            .visual-panel::before { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="visual-panel">
            <div class="brand-wrapper">
                <div class="logo-container">
                    <img src="realistic_eagle_logo.png" alt="Blessd Cargo Movers Premium Logo">
                </div>
                <h1 class="brand-title">Blessd Cargo<br>Movers</h1>
                <div class="brand-divider"></div>
                <p class="brand-tagline">Secure Logistics & Supply Chain Management</p>
            </div>
        </div>

        <div class="form-panel">
            <div class="login-card">
                <div class="form-header">
                    <h2>System Access</h2>
                    <p>Enter gateway credentials to initialize application state.</p>
                </div>

                <form id="gatekeeperForm" onsubmit="verifyGatekeeper(event)">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="password" id="gatekeeperPassword" class="password-field" placeholder="Access Token / Password" required>
                            <span class="toggle-password" onclick="toggleVisibility()">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="unlock-button">AUTHENTICATE</button>
                </form>

                <div class="footer-links">
                    <a href="#" class="forgot-link" onclick="alert('Please contact the primary system administrator for recovery tokens.')">Need support accessing the terminal?</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleVisibility() {
            const passwordField = document.getElementById('gatekeeperPassword');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.textContent = '🔒';
            } else {
                passwordField.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        function verifyGatekeeper(event) {
            event.preventDefault();
            const passwordField = document.getElementById('gatekeeperPassword');
            const loginCard = document.querySelector('.login-card');
            const token = passwordField.value;

            // System access token validation logic
            if (token === "0102") {
                // Hardware-accelerated interface transition fadeout 
                loginCard.style.opacity = '0';
                loginCard.style.transition = 'opacity 0.4s ease';
                setTimeout(() => {
                    window.location.href = "book.html";
                }, 400);
            } else {
                // Inline runtime state changes highlighting bad syntax 
                passwordField.style.borderColor = '#ef4444';
                passwordField.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.2)';
                
                // Clear state vectors and play interactive container shake
                loginCard.style.animation = 'none';
                void loginCard.offsetWidth; // Recalculate canvas boundaries to reset keyframes
                loginCard.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
                
                // Display structural warning indicators
                passwordField.value = '';
                passwordField.placeholder = 'Invalid Access Token - Denied';
                
                // Reset styling definitions safely via background threads
                setTimeout(() => {
                    passwordField.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                    passwordField.style.boxShadow = 'none';
                    passwordField.placeholder = 'Access Token / Password';
                }, 2000);
            }
        }
    </script>
</body>
</html>
