<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessd Cargo Movers - Secure Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0b1329;
            --bg-surface: rgba(28, 37, 65, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-gold: #e5a93c;
            --primary-hover: #cca353;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Split Screen Layout */
        .portal-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Side: Brand Visual Panel */
        .visual-panel {
            flex: 1.2;
            background: radial-gradient(circle at 30% 30%, #1c2541 0%, #0b1329 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 3rem;
            border-right: 1px solid var(--border-subtle);
        }

        /* Abstract Premium Geometric Accents */
        .visual-panel::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(229, 169, 60, 0.05) 0%, transparent 70%);
            top: 15%;
            left: 15%;
            animation: float 8s ease-in-out infinite alternate;
        }

        /* Brand Identity Elements */
        .brand-wrapper {
            text-align: center;
            z-index: 2;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(229, 169, 60, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .logo-container img {
            width: 50px;
            height: auto;
            object-fit: contain;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-main);
            line-height: 1.3;
            text-transform: uppercase;
        }

        .brand-divider {
            width: 60px;
            height: 3px;
            background: var(--primary-gold);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .brand-tagline {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 400;
        }

        /* Right Side: Interaction Form */
        .form-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            background: #070c19;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 2.5rem;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Custom Input Styling */
        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field {
            width: 100%;
            padding: 1.1rem 3.5rem 1.1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .password-field::placeholder {
            color: #475569;
        }

        .password-field:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(229, 169, 60, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.25rem;
            user-select: none;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-gold);
        }

        /* Action Buttons */
        .unlock-button {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #bd8422 100%);
            border: none;
            border-radius: 12px;
            color: #0b1329;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(229, 169, 60, 0.2);
        }

        .unlock-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 169, 60, 0.4);
        }

        .unlock-button:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
            font-weight: 500;
        }

        .forgot-link:hover {
            color: var(--primary-gold);
        }

        /* Subtle Background Animation */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.05); }
        }

        /* Premium Shake Keyframes for Invalid Authentication */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Responsive UI Adjustments */
        @media (max-width: 968px) {
            body { overflow-y: auto; }
            .portal-container { flex-direction: column; }
            .visual-panel { flex: none; padding: 4rem 2rem 2rem 2rem; border-right: none; border-bottom: 1px solid var(--border-subtle); }
            .form-panel { flex: 1; padding: 3rem 1.5rem; }
            .brand-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="visual-panel">
            <div class="brand-wrapper">
                <div class="logo-container">
                    <img src="https://img.icons8.com/color/96/000000/eagle.png" alt="Blessd Cargo Movers Logo">
                </div>
                <h1 class="brand-title">Blessd Cargo<br>Movers</h1>
                <div class="brand-divider"></div>
                <p class="brand-tagline">Secure Logistics & Supply Chain Management</p>
            </div>
        </div>

        <div class="form-panel">
            <div class="login-card">
                <div class="form-header">
                    <h2>System Access</h2>
                    <p>Enter gateway credentials to initialize application state.</p>
                </div>

                <form id="gatekeeperForm" onsubmit="verifyGatekeeper(event)">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="password" id="gatekeeperPassword" class="password-field" placeholder="Access Token / Password" required>
                            <span class="toggle-password" onclick="toggleVisibility()">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="unlock-button">AUTHENTICATE</button>
                </form>

                <div class="footer-links">
                    <a href="#" class="forgot-link" onclick="alert('Please contact the primary system administrator for recovery tokens.')">Need support accessing the terminal?</a>
                </div>
            </div>
        </div>
    </div>

            const toggleIcon = document.querySelector('.toggle-password');
